<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CV · Elena González Prieto</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: #525659;
      font-family: 'Times New Roman', serif;
    }
    .bar {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
      padding: 0.65rem 1.25rem;
      background: #2d2d2d; color: #fff;
    }
    .bar a {
      color: #fff; text-decoration: none;
      padding: 0.4rem 0.9rem;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .bar a:hover { background: rgba(255,255,255,0.12); }
    .bar a.primary {
      background: #3E2A5C; border-color: #3E2A5C;
    }
    #viewer {
      display: flex; flex-direction: column; align-items: center;
      gap: 1.25rem; padding: 1.5rem 1rem 3rem;
    }
    #viewer canvas,
    #viewer img {
      width: min(1100px, 100%);
      height: auto;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    }
    #status {
      color: #ddd;
      text-align: center;
      padding: 2rem 1rem;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div class="bar">
    <a href="cv.html">← Back</a>
    <span>Elena González Prieto — CV</span>
    <a class="primary" href="cv.pdf" download="Elena_Gonzalez_Prieto_CV.pdf">Download PDF</a>
  </div>
  <div id="status">Loading CV…</div>
  <div id="viewer"></div>
  <script>
    (function () {
      var statusEl = document.getElementById('status');
      var viewer = document.getElementById('viewer');
      var PAGE_WIDTH = Math.min(1100, window.innerWidth - 32);

      function showImages() {
        statusEl.textContent = '';
        viewer.innerHTML = '';
        for (var i = 1; i <= 4; i++) {
          var img = document.createElement('img');
          img.src = 'cv-pages/page-' + i + '.png?v=3';
          img.alt = 'CV page ' + i;
          img.width = 2550;
          img.height = 3300;
          viewer.appendChild(img);
        }
      }

      if (!window['pdfjsLib']) {
        showImages();
        return;
      }

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      pdfjsLib.getDocument('cv.pdf').promise.then(function (pdf) {
        statusEl.textContent = '';
        var chain = Promise.resolve();
        for (var n = 1; n <= pdf.numPages; n++) {
          (function (pageNum) {
            chain = chain.then(function () {
              return pdf.getPage(pageNum).then(function (page) {
                var base = page.getViewport({ scale: 1 });
                var cssScale = PAGE_WIDTH / base.width;
                var outputScale = Math.max(2, Math.min(window.devicePixelRatio || 2, 3));
                var viewport = page.getViewport({ scale: cssScale * outputScale });
                var canvas = document.createElement('canvas');
                canvas.width = Math.floor(viewport.width);
                canvas.height = Math.floor(viewport.height);
                canvas.style.width = PAGE_WIDTH + 'px';
                canvas.style.height = Math.floor(base.height * cssScale) + 'px';
                viewer.appendChild(canvas);
                return page.render({
                  canvasContext: canvas.getContext('2d'),
                  viewport: viewport
                }).promise;
              });
            });
          })(n);
        }
        return chain;
      }).catch(function (err) {
        console.error(err);
        showImages();
      });
    })();
  </script>
</body>
</html>
